name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.DROIDMCP_KEYSTORE_B64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.DROIDMCP_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DROIDMCP_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          DROIDMCP_KEYSTORE_PASSWORD: ${{ secrets.DROIDMCP_KEYSTORE_PASSWORD }}
          DROIDMCP_KEY_ALIAS: ${{ secrets.DROIDMCP_KEY_ALIAS }}
          DROIDMCP_KEY_PASSWORD: ${{ secrets.DROIDMCP_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --no-configuration-cache

      - name: Name APKs
        run: |
          mkdir -p out
          V="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "out/DroidMCP-${V}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/DroidMCP-${V}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: android/out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/out/*.apk
          generate_release_notes: true

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Node relay
        working-directory: relay
        run: npm install --omit=dev && node --check server.js
      - name: Check Cloudflare relay
        working-directory: relay-cloudflare
        run: npx --yes wrangler@4 deploy --dry-run --outdir dist
